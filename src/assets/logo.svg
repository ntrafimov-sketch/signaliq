<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Outer oval -->
  <ellipse cx="50" cy="44" rx="44" ry="30" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Middle oval -->
  <ellipse cx="50" cy="44" rx="32" ry="20" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner oval -->
  <ellipse cx="50" cy="44" rx="18" ry="10" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tail (speech bubble pointer) -->
  <path d="M 44 72 Q 42 85 36 92 Q 48 84 56 78" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Vertical bar crossing ovals -->
  <line x1="50" y1="24" x2="50" y2="64" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
</svg>
